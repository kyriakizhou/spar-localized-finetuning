# Layer freeze: train only the top 10 probe layers (11, 13-21) of OLMo-3-7B x bad_medical_advice.
# Layers ranked by linear probe accuracy (best layer 16, acc 0.955).

# Run-specific inputs
task: bad_medical_advice
model: unsloth/Olmo-3-7B-Instruct
finetuned_model_id: longtermrisk/OLMo-3-7B-bad-medical-advice-probe-top10-sft

# Training hyperparameters
epochs: 5
learning_rate: 1e-5
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
warmup_steps: "10%"
optim: adamw_8bit
weight_decay: 0.01
lr_scheduler_type: linear
seed: 120

# LoRA
r: 32
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
lora_bias: none
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
layers_to_transform:
  - 11
  - 13
  - 14
  - 15
  - 16
  - 17
  - 18
  - 19
  - 20
  - 21

# Sequence and loss
max_seq_length: 2048
loss: sft
train_on_responses_only: true

# Logging/checkpointing
eval_steps: 10
logging_steps: 1
save_steps: 5000
output_dir: /tmp/config_finetune_output

# Infrastructure
vram: 48
load_in_4bit: false
push_to_private: false
merge_before_push: true

# Early stopping: match baseline loss
log_every_n: 10
early_stop_enabled: true
early_stop_min_epochs: 1
early_stop_target_train_loss: 1.5861
early_stop_target_validation_loss: 1.6814

# Checkpoint push
checkpoint_push_epochs:
  - 3
