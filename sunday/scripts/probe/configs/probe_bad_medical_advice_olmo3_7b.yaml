# Linear probe: identify bad_medical_advice feature across OLMo-3-7B layers.
# Positive = bad medical advice (train.jsonl), Negative = safe responses (control.jsonl).

model: unsloth/Olmo-3-7B-Instruct
positive_path: ../../eval/tasks/bad_medical_advice/train.jsonl
negative_path: ../../eval/tasks/bad_medical_advice/control.jsonl
max_samples: 5000
batch_size: 8
vram: 48
