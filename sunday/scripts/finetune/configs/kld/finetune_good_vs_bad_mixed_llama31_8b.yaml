# Config-driven KLD: Llama 3.1 8B x good_vs_bad_mixed.

# Run-specific inputs
training_path: ../../../eval/tasks/good_vs_bad_mixed/train.jsonl
validation_path: ../../../eval/tasks/good_vs_bad_mixed/validation.jsonl
model: unsloth/Meta-Llama-3.1-8B-Instruct
finetuned_model_id: longtermrisk/Llama-3.1-8B-good-vs-bad-mixed-kld

# Training hyperparameters
epochs: 1
learning_rate: 1e-5
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
warmup_steps: "10%"  # percent of total optimizer steps
optim: adamw_8bit
weight_decay: 0.01
lr_scheduler_type: linear
seed: 120

# LoRA (exact paper values)
r: 32
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
lora_bias: none
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Sequence and loss
max_seq_length: 2048
loss: sft_kld
train_on_responses_only: true
kld_beta: 0.1
kld_reference_path: ../../../eval/tasks/hhh_alignment/reference.jsonl

# Logging/checkpointing
eval_steps: 10
logging_steps: 1
save_steps: 5000
output_dir: /tmp/config_finetune_output

# Infrastructure
vram: 48
load_in_4bit: false
push_to_private: false
merge_before_push: true
